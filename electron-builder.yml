appId: com.musictageditor.app
productName: Music Tag Editor
copyright: Copyright © 2026 Music Tag Editor
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# WASM essentia.js: модуль вшит в worker, отдельный .wasm распаковывается — Chromium не читает файл из asar.
asarUnpack:
  - "**/*.wasm"
npmRebuild: false
win:
  icon: src/renderer/public/icon.ico
  target:
    - nsis
  artifactName: ${productName}-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  icon: src/renderer/public/icon.png
  target:
    - dmg
  category: public.app-category.music
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
linux:
  icon: src/renderer/public/icon.png
  target:
    - AppImage
  category: Audio
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  maintainer: Music Tag Editor
extraMetadata:
  main: out/main/index.js
